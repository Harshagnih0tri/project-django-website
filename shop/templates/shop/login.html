{% extends "shop/base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}

<h1 class="section-title">Log In</h1>

<div class="form-card">
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<div class="form-errors">{{ error }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button class="btn btn-block" type="submit">Log In</button>
  </form>
  <p class="form-footnote">No account? <a href="{% url 'shop:register' %}">Register</a></p>
  <p class="form-footnote">Demo admin: admin / admin12345</p>
</div>

{% endblock %}
