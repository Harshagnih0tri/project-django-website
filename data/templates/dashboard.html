<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Todo App</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f2f5;
        }
        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 30px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        form {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        input[type="submit"] {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        ul {
            padding-left: 0;
        }
        li {
            list-style: none;
            background-color: #e9ecef;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
        }
        .logout-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #dc3545;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Your Todo List</h2>
        <form method="POST">
            {{ form.hidden_tag() }}
            {{ form.content.label }}
            {{ form.content }}
            {{ form.submit }}
        </form>
        <ul>
            {% for todo in todos %}
                <li>{{ todo.content }}</li>
            {% else %}
                <li>No tasks yet. Start by adding one above!</li>
            {% endfor %}
        </ul>
        <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
    </div>
</body>
</html>
