{% extends "base.html" %}
{% block title %}{{ product.name }}{% endblock %}
{% block content %}
<a href="{{ url_for('index') }}">&larr; Back to products</a>
<div class="card" style="margin-top:14px; max-width:500px;">
  <img src="{{ product.image_url or 'https://placehold.co/500x300?text=' + product.name|urlencode }}" style="width:100%; border-radius:6px;" alt="{{ product.name }}">
  <h1>{{ product.name }}</h1>
  <p>{{ product.description }}</p>
  <div class="price">₹{{ '%.2f' % product.price }}</div>
  <div class="stock">{{ product.stock }} in stock</div>
  <form method="post" action="{{ url_for('add_to_cart', product_id=product.id) }}" style="margin-top:12px;">
    <label for="quantity">Quantity</label>
    <input type="number" name="quantity" id="quantity" value="1" min="1" max="{{ product.stock }}">
    <button class="btn" type="submit" {% if product.stock == 0 %}disabled{% endif %}>Add to Cart</button>
  </form>
</div>
{% endblock %}
