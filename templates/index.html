{% extends "base.html" %}
{% block title %}Products{% endblock %}
{% block content %}
<h1>Products</h1>
<div class="grid">
  {% for product in products %}
  <div class="card product-card">
    <a href="{{ url_for('product_detail', product_id=product.id) }}">
      <img src="{{ product.image_url or 'https://placehold.co/300x200?text=' + product.name|urlencode }}" alt="{{ product.name }}">
      <h3>{{ product.name }}</h3>
    </a>
    <div class="price">₹{{ '%.2f' % product.price }}</div>
    <div class="stock">{{ product.stock }} in stock</div>
    <form method="post" action="{{ url_for('add_to_cart', product_id=product.id) }}">
      <input type="hidden" name="quantity" value="1">
      <button class="btn" type="submit" {% if product.stock == 0 %}disabled{% endif %}>Add to Cart</button>
    </form>
  </div>
  {% else %}
  <p>No products yet.</p>
  {% endfor %}
</div>
{% endblock %}
